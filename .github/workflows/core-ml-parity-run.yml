# Fork-only: runs the Core ML parity comparison on a macOS runner. Never PR'd upstream.
name: Core ML parity run

on:
  push:
    branches: [ops/core-ml-parity-run]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same versions as the iOS repo's scripts/fetch-models.sh used for the export.
      - name: Install
        run: |
          python -m pip install "torch==2.7.1" "torchvision==0.22.1" "coremltools==9.0"
          python -m pip install -e '.[benchmark]'
          python -m pip list | grep -iE "^(torch|coremltools|ultralytics|numpy) "
      - name: Download v1.0 (.pt and .mlpackage) and the public test split
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("Totorotibo84/box2boxcam-football-ball-detection",
                            local_dir="hf/model",
                            allow_patterns=["box2boxcam-ball-v1.0.pt",
                                            "box2boxcam-ball-v1.0.mlpackage/*"])
          snapshot_download("Totorotibo84/box2boxcam-football-ball-detection-dataset",
                            repo_type="dataset", local_dir="hf/dataset",
                            allow_patterns=["images/test/*", "labels/test/*"])
          PY
          ls hf/model; ls hf/dataset/images/test | wc -l
      - name: Compare at the export's own floor (conf 0.1)
        run: |
          mkdir -p out
          python scripts/evaluate_detector.py \
            --weights hf/model/box2boxcam-ball-v1.0.mlpackage \
            --compare hf/model/box2boxcam-ball-v1.0.pt \
            --frames-dir hf/dataset/images/test --labels hf/dataset/labels/test \
            --conf 0.1 --device cpu --agreement --out-json out/parity_conf010.json \
            2>&1 | tee out/parity_conf010.txt
      - name: Same with the script default (conf 0.05) to show the floor warning
        run: |
          python scripts/evaluate_detector.py \
            --weights hf/model/box2boxcam-ball-v1.0.mlpackage \
            --compare hf/model/box2boxcam-ball-v1.0.pt \
            --frames-dir hf/dataset/images/test --labels hf/dataset/labels/test \
            --device cpu --agreement --out-json out/parity_conf005.json \
            2>&1 | tee out/parity_conf005.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Core ML parity, conf 0.1'; echo; sed -n '/^| model/,$p' out/parity_conf010.txt; } >> "$GITHUB_STEP_SUMMARY" || true
          sysctl -n machdep.cpu.brand_string >> out/machine.txt; sw_vers >> out/machine.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-ml-parity
          path: out/
