name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'ruff>=0.12'
      - run: python -m ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only torch keeps the install small; the tests need no GPU.
      - name: Install CPU torch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      # Some tests import torch, numpy, cv2, scipy and ipympl, so install every extra they touch.
      - name: Install package
        run: python -m pip install -e '.[dev,benchmark,notebook]'
      # Tests that need local YOLO weights skip themselves; no data, network or keys are used.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
